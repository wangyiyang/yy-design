<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0A0A0A; }

      [data-composition-id="main"] {
        width: 1920px; height: 1080px;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 40px;
        font-family: "Noto Serif SC", "Source Han Serif SC", serif;
      }

      .logo-mark {
        font-size: 280px; font-weight: 600; color: #FAFAFA;
        line-height: 1; letter-spacing: -0.05em;
        display: flex; align-items: center;
      }
      .bracket { font-family: "JetBrains Mono", monospace; font-weight: 400; }
      .accent-dot {
        width: 20px; height: 20px; background: #C0392B;
        border-radius: 50%; margin-left: 8px;
        align-self: flex-start; margin-top: 40px;
      }
      .brand-name {
        font-size: 42px; color: #FAFAFA; letter-spacing: 0.15em;
      }
      .tagline {
        font-family: "JetBrains Mono", monospace;
        font-size: 28px; color: rgba(250,250,250,0.5);
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main"
         data-start="0" data-duration="5"
         data-width="1920" data-height="1080">

      <div id="logo" class="logo-mark">
        <span class="bracket" id="bl">{</span>
        <span id="yi">翊</span>
        <span class="bracket" id="br">}</span>
        <span class="accent-dot" id="dot"></span>
      </div>
      <div id="brand" class="brand-name">翊行代码</div>
      <div id="tagline" class="tagline">Code, one stroke at a time.</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Logo 入场：从虚无中凝聚
      tl.from("#bl, #br", {
        opacity: 0, scale: 1.5, duration: 0.8, ease: "expo.out", stagger: 0.15
      }, 0.2);
      tl.from("#yi", {
        opacity: 0, y: 40, duration: 1, ease: "expo.out"
      }, 0.5);
      tl.from("#dot", {
        opacity: 0, scale: 0, duration: 0.4, ease: "back.out(3)"
      }, 1.2);

      // 品牌名 + tagline
      tl.from("#brand", { opacity: 0, y: 20, duration: 0.7, ease: "power2.out" }, 2);
      tl.from("#tagline", { opacity: 0, y: 15, duration: 0.6, ease: "power2.out" }, 2.5);

      // 退场
      tl.to("#logo, #brand, #tagline", {
        opacity: 0, duration: 0.8, ease: "power2.in"
      }, 4.2);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
