<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY Design · Node Network Cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0A0A0F;
      overflow: hidden;
      position: relative;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="cover"></canvas>
  <script>
    const canvas = document.getElementById('cover');
    const ctx = canvas.getContext('2d');
    canvas.width = 1200;
    canvas.height = 630;

    // Configuration
    const NODE_COUNT = 8;
    const NODE_COLOR = '#E94560';
    const LINE_COLOR = 'rgba(233, 69, 96, 0.15)';
    const BG_COLOR = '#0A0A0F';
    const GLOW_COLOR = 'rgba(233, 69, 96, 0.3)';

    // Generate nodes
    const nodes = [];
    for (let i = 0; i < NODE_COUNT; i++) {
      nodes.push({
        x: 200 + Math.random() * 800,
        y: 150 + Math.random() * 400,
        radius: 6 + Math.random() * 12,
        pulse: Math.random() * Math.PI * 2,
        speed: 0.02 + Math.random() * 0.03
      });
    }

    // Animation
    let time = 0;
    function animate() {
      ctx.fillStyle = BG_COLOR;
      ctx.fillRect(0, 0, 1200, 630);

      // Draw connections
      ctx.strokeStyle = LINE_COLOR;
      ctx.lineWidth = 1;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 350) {
            ctx.globalAlpha = 1 - dist / 350;
            ctx.beginPath();
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }
      ctx.globalAlpha = 1;

      // Draw nodes
      nodes.forEach(node => {
        const pulseSize = Math.sin(time * node.speed + node.pulse) * 3;
        
        // Glow
        const gradient = ctx.createRadialGradient(
          node.x, node.y, 0,
          node.x, node.y, node.radius * 3 + pulseSize
        );
        gradient.addColorStop(0, GLOW_COLOR);
        gradient.addColorStop(1, 'transparent');
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius * 3 + pulseSize, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.fillStyle = NODE_COLOR;
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + pulseSize * 0.3, 0, Math.PI * 2);
        ctx.fill();
      });

      // Subtle grid
      ctx.strokeStyle = 'rgba(234, 234, 234, 0.03)';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < 1200; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 630);
        ctx.stroke();
      }
      for (let y = 0; y < 630; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(1200, y);
        ctx.stroke();
      }

      time++;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
