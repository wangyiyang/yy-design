<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../assets/yy-color-palette.css">
  <link rel="stylesheet" href="../assets/yy-typography.css">
  <style>
    body { padding: 40px; }
    .sample { margin-bottom: 32px; }
  </style>
</head>
<body class="yy-theme-light">
  <div class="sample">
    <h1 class="yy-h1">思源宋体标题 · 墨黑 #0A0A0A</h1>
    <p class="yy-body">思源黑体正文 · 行高 1.7 · 宣白背景</p>
  </div>
  <div class="sample">
    <p class="yy-en-title">Inter SemiBold · Code, one stroke at a time.</p>
    <p class="yy-en">Inter Regular · English body text with 1.7 line height.</p>
  </div>
  <div class="sample">
    <code class="yy-code">JetBrains Mono · console.log('test');</code>
  </div>
  <div class="sample">
    <p style="color: var(--yy-vermillion)">朱红 #C0392B · 单点高亮</p>
    <p style="color: var(--yy-gold)">哑金 #B8860B · 奢华点缀</p>
  </div>
  <div class="sample">
    <p class="yy-caption">Caption 12px · 辅助文字</p>
    <p class="yy-small">Small 14px · 次要信息</p>
  </div>
</body>
</html>
