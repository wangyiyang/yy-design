<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YY Design · Geometric Split Cover</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #0A0A0F;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1200" height="630" fill="#0A0A0F"/>
    
    <!-- Split areas -->
    <polygon points="0,0 800,0 600,630 0,630" fill="#1A1A2E"/>
    <polygon points="800,0 1200,0 1200,630 600,630" fill="#0A0A0F"/>
    
    <!-- Divider line -->
    <line x1="800" y1="0" x2="600" y2="630" 
          stroke="#E94560" stroke-width="2" opacity="0.8"/>
    
    <!-- Glowing node on divider -->
    <circle cx="700" cy="315" r="40" fill="url(#glow)" opacity="0.6"/>
    <circle cx="700" cy="315" r="12" fill="#E94560"/>
    
    <!-- Subtle grid on left -->
    <g stroke="rgba(234,234,234,0.04)" stroke-width="0.5">
      <line x1="0" y1="157" x2="700" y2="157"/>
      <line x1="0" y1="315" x2="700" y2="315"/>
      <line x1="0" y1="472" x2="700" y2="472"/>
      <line x1="200" y1="0" x2="150" y2="630"/>
      <line x1="400" y1="0" x2="350" y2="630"/>
      <line x1="600" y1="0" x2="550" y2="630"/>
    </g>
    
    <!-- Corner accent -->
    <rect x="20" y="20" width="60" height="2" fill="#E94560" opacity="0.5"/>
    <rect x="20" y="20" width="2" height="60" fill="#E94560" opacity="0.5"/>
    
    <rect x="1120" y="590" width="60" height="2" fill="#E94560" opacity="0.5"/>
    <rect x="1178" y="550" width="2" height="60" fill="#E94560" opacity="0.5"/>
    
    <!-- Definitions -->
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#E94560" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#E94560" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
</body>
</html>
